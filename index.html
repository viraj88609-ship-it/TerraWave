  <style>
    :root{color-scheme:dark;--bg:#040b14;--navy:#071426;--panel:#0b1d31;--sky:#58c9ff;--blue:#168fd3;--ink:#f2f9ff;--muted:#a8bfd2;--line:rgba(118,198,241,.19);--green:#77e0b5;--shadow:0 28px 80px rgba(0,0,0,.36)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 0,#123f63 0,transparent 28%),linear-gradient(155deg,#02070d,#071426 54%,#06101d);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}a{color:inherit}.shell{width:min(1180px,calc(100% - 34px));margin:auto}.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#000;padding:10px 14px;border-radius:8px;z-index:99}.skip:focus{left:12px}
    header{position:sticky;top:0;z-index:20;background:rgba(4,11,20,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.header-inner{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:820;letter-spacing:-.02em}.ball{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(88,201,255,.10);position:relative}.ball:after{content:"";position:absolute;left:16px;top:4px;width:4px;height:28px;border-left:2px solid var(--blue);border-right:2px solid var(--blue);transform:rotate(-18deg)}nav{display:flex;align-items:center;gap:7px}nav a{color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:999px;font-size:.92rem;font-weight:650}nav a:hover,nav a:focus-visible{background:rgba(88,201,255,.10);color:#fff;outline:none}
    .hero{display:grid;grid-template-columns:1.02fr .98fr;gap:48px;align-items:center;padding:72px 0 55px}.kicker,.eyebrow{color:var(--sky);font-weight:800;letter-spacing:.09em;text-transform:uppercase;font-size:.78rem}.status{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(11,29,49,.7);font-size:.82rem;color:var(--muted)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(119,224,181,.8)}h1{font-size:clamp(2.7rem,6vw,5.7rem);line-height:.94;letter-spacing:-.065em;margin:13px 0 23px}.lead{font-size:clamp(1.04rem,2vw,1.22rem);color:var(--muted);max-width:640px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:29px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:49px;padding:0 19px;border:1px solid transparent;border-radius:13px;background:linear-gradient(135deg,var(--sky),#2aa9ec);color:#03111e;font:inherit;font-weight:820;text-decoration:none;cursor:pointer;box-shadow:0 12px 34px rgba(24,143,211,.22);transition:transform .18s ease}.button.secondary{color:var(--ink);background:rgba(16,50,78,.62);border-color:var(--line);box-shadow:none}.button:hover,.button:focus-visible{transform:translateY(-2px);outline:2px solid #fff;outline-offset:3px}.trust{display:flex;flex-wrap:wrap;gap:18px;margin-top:25px;color:#8daac0;font-size:.86rem}.trust span{display:flex;align-items:center;gap:7px}.trust i{font-style:normal;color:var(--green)}
    .hero-media{position:relative}.hero-media img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:30px;border:1px solid rgba(88,201,255,.22);box-shadow:var(--shadow)}.media-badge{position:absolute;left:-18px;bottom:24px;width:min(260px,72%);padding:16px 17px;background:rgba(4,15,27,.93);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.32)}.media-badge strong{display:block;font-size:.95rem}.media-badge span{display:block;color:var(--muted);font-size:.79rem;margin-top:3px}
    section{scroll-margin-top:92px}.section{padding:56px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}.section h2{font-size:clamp(1.8rem,4vw,3rem);line-height:1.1;letter-spacing:-.045em;margin:7px 0 0}.section-note{max-width:460px;color:var(--muted);margin:0}.fixture-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.fixture{position:relative;padding:24px;background:linear-gradient(145deg,rgba(18,55,84,.88),rgba(7,25,43,.92));border:1px solid var(--line);border-radius:21px;overflow:hidden}.fixture:before{content:"";position:absolute;right:-30px;top:-35px;width:100px;height:100px;border-radius:50%;background:rgba(88,201,255,.07)}.fixture time{color:var(--sky);font-weight:800;font-size:.86rem}.fixture h3{font-size:1.16rem;margin:15px 0 4px}.fixture p{color:var(--muted);margin:0}.fixture .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{padding:6px 9px;border-radius:999px;background:rgba(88,201,255,.08);border:1px solid var(--line);color:#bed8e9;font-size:.78rem}
    .video-wrap{display:grid;grid-template-columns:1.28fr .72fr;gap:24px;align-items:stretch}.video-card{position:relative;padding:10px;background:#02070d;border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow)}video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:17px;background:#061426}.video-copy{padding:30px;background:linear-gradient(145deg,rgba(15,47,75,.85),rgba(6,24,42,.9));border:1px solid var(--line);border-radius:25px}.video-copy h3{font-size:1.55rem;line-height:1.15;margin:14px 0}.video-copy p{color:var(--muted)}.video-copy .button{width:100%;margin-top:12px}

    @media(max-width:900px){.hero,.video-wrap{grid-template-columns:1fr}.hero-media{order:-1}.hero-media img{aspect-ratio:16/9}.media-badge{left:16px}.fixture-grid,.story-grid{grid-template-columns:1fr 1fr}.section-head{align-items:start;flex-direction:column}.video-copy{padding:24px}}@media(max-width:640px){.shell{width:min(100% - 24px,1180px)}.header-inner{min-height:64px}.brand span:last-child{font-size:.93rem}nav a:not(:last-child){display:none}.hero{padding:34px 0 38px;gap:28px}.hero-media img{border-radius:20px}.media-badge{left:10px;bottom:10px;padding:12px;width:75%}h1{font-size:clamp(2.55rem,15vw,4.1rem)}.actions{display:grid}.button{width:100%}.fixture-grid,.story-grid,.info-grid{grid-template-columns:1fr}.section{padding:42px 0}.footer-inner{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button{transition:none}}
